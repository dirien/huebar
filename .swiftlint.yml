# SwiftLint: https://realm.github.io/SwiftLint/rule-directory.html
# Formatting (indentation, wrapping, commas) is owned by swift-format (.swift-format);
# SwiftLint covers correctness and idiom. Run both with `make lint`; auto-fix with `make fix`.

included:
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - Sources/HueBar/Icons/PhosphorIcons.swift # generated

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_object_literal
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - yoda_condition

disabled_rules:
  - trailing_comma # swift-format adds trailing commas to multi-line literals
  - opening_brace # swift-format decides brace placement for wrapped conditions
  # pattern_matching_keywords (opt-in) is left off: it contradicts swift-format's UseLetInEveryBoundCaseVariable.

line_length:
  warning: 120
  ignores_urls: true
  ignores_interpolated_strings: true

identifier_name:
  excluded: [id, on, x, y, z, xy, r, g, b, a, t, i, ip, op]

type_name:
  excluded: [Ph, XY, RGB]

# HueStore is the single source of truth for app state; give it a little more room than the defaults.
type_body_length:
  warning: 450
  error: 600

file_length:
  warning: 650
  error: 900

function_body_length:
  warning: 80
  error: 120

cyclomatic_complexity:
  warning: 12
  ignores_case_statements: true
